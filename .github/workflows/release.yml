name: Release

# Push a vX.Y.Z tag matching pyproject.toml's version to publish that version
# to PyPI (Trusted Publishing, environment "pypi") and create the GitHub release.

on:
  push:
    tags: ["v*.*.*"]

jobs:
  check-version:
    name: Check tag matches release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"

  test:
    name: Test
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/ -m "not integration and not slow" -q
      - run: uv build
      - name: Smoke-test the built wheel in a clean venv
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/python -I scripts/smoke_wheel.py

  build:
    name: Build distributions and release notes
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Built here, before publishing, so a missing CHANGELOG section stops the
      # release before PyPI (which can't be undone) rather than after it.
      - name: Release notes (changelog section + compatibility)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLOOR=$(python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'))['project']['dependencies'];print(next(x.split('>=')[1] for x in d if x.startswith('dazpy>=')))")
          pip install "dazpy==${FLOOR}"
          awk -v h="## [${VERSION}]" '
            index($0, h) == 1 {on=1; next}
            on && index($0, "## [") == 1 {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }
          echo "" >> notes.md
          python scripts/compat_block.py >> notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # No skip-existing: re-publishing a version must fail loudly.
      - uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
