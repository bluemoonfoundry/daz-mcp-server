[project]
name = "vangard-daz-mcp"
version = "0.5.0"
description = "MCP server wrapping the DazScriptServer HTTP API for DAZ Studio"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Blue Moon Foundry", email = "gshirpara@gmail.com"},
]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "dazpy>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/bluemoonfoundry/daz-mcp-server"
Repository = "https://github.com/bluemoonfoundry/daz-mcp-server"
Documentation = "https://bluemoonfoundry.github.io/daz-script-server/"
"Bug Tracker" = "https://github.com/bluemoonfoundry/daz-mcp-server/issues"

[project.scripts]
vangard-daz-mcp = "vangard_daz_mcp.server:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vangard_daz_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require a running DAZ Studio instance (skipped automatically if not reachable)",
    "slow: tests that trigger actual renders (time-consuming — excluded by default, run with -m slow)",
    "two_figures: tests that require at least 2 figures loaded in the scene",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pylint.messages_control]
# Rationale (daz-mcp-server-0t0): every tool function in tools/*.py that talks to
# DAZ Studio catches `Exception` broadly on purpose and routes it into
# handle_dazpy_error()'s typed-exception dispatch (see _errors.py) so callers get a
# single well-formed ToolError regardless of which dazpy exception fired.
# integration_test.py's runner does the same for its own reason: it must keep
# testing the remaining tools after one throws, so it can report a full pass/fail
# summary. Confirmed by sampling; not a defect in either case.
disable = ["broad-exception-caught"]

# redefined-outer-name and unused-argument are NOT disabled here. In tests/ they
# are overwhelmingly the standard pytest-fixture-as-parameter idiom (e.g. every
# test taking `live_client`), but in src/ a handful of hits are real -- e.g.
# daz_browse_category's `sort_by` parameter is accepted but never passed through
# to the underlying call. Blanket-disabling repo-wide would hide those. See
# pylint.yml, which scopes the two test-idiom disables to tests/ only, and
# daz-mcp-server-r13, which tracks auditing the remaining src/ hits individually.
#
# no-name-in-module / no-member are also left enabled: sampling showed these are
# not dynamic-attribute false positives but real stale imports from the
# pre-refactor `vangard_daz_mcp.server` module path (see daz-mcp-server-ful).
#
# missing-*-docstring is left enabled: whether to write the ~491 missing
# docstrings or suppress the check is a real team decision, not a false
# positive to tune away (tracked in daz-mcp-server-dk7).

[tool.pylint.similarities]
# Rationale (daz-mcp-server-cw8): with pylint's default of 4, duplicate-code
# (R0801) mostly flagged the `try: return await run_dazpy(_run) except
# ToolError: raise except Exception as e: handle_dazpy_error(e)` wrapper
# repeated across nearly every dazpy-routed tool in tools/*.py -- an
# intentional, structurally-necessary pattern, not accidental duplication.
# Raised past that boilerplate's length (verified: eliminates 11 of 12
# remaining pairs after two genuine duplications -- _EMOTION_DEFINITIONS and
# the _execute/daz_execute payload+error-handling logic -- were extracted
# into shared code). The one pair still above this threshold
# (conftest.py vs test_phase5_integration.py's fixtures) is deliberate
# per SKILL_DEVELOPMENT.md and carries its own inline disable + rationale.
min-similarity-lines = 8
